<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firas Stock Research</title>
<style>body{font:16px system-ui;background:#f4f5fa;color:#182033;margin:0;padding:2rem}main{max-width:1100px;margin:auto}section{background:white;border-radius:12px;padding:1.5rem;margin:1rem 0;overflow:auto}h1{margin-bottom:.4rem}th,td{padding:.8rem;text-align:left;border-bottom:1px solid #ddd}table{width:100%;border-collapse:collapse}#status{font-weight:600}.muted{color:#525e72}</style>
<main><h1>Stock research dashboard</h1><p class="muted">Historical daily data. Research signals are not trading instructions or live quotes.</p>
<section><p id="status" role="status">Loading the latest published research scan...</p><p id="details"></p></section>
<section><table><thead><tr><th>Symbol</th><th>Bar time</th><th>Close</th><th>Score</th><th>Research signal</th></tr></thead><tbody id="rows"></tbody></table></section>
<p class="muted">No brokerage orders can be placed here. Missing data is not replaced with sample prices.</p></main>
<script>
(async()=>{const status=document.getElementById('status');try{const response=await fetch('data/output/scan_latest.json',{cache:'no-store'});if(!response.ok)throw Error('No published scan is available.');const data=await response.json();if(!Array.isArray(data.records)||data.records.length>5000)throw Error('Invalid scan format.');const generated=Date.parse(data.generated_at);const age=Date.now()-generated;if(!Number.isFinite(generated)||age< -5000)throw Error('Invalid scan timestamp.');status.textContent=age>86400000?'STALE: this scan is over 24 hours old.':'Research scan available. Verify each bar time before use.';document.getElementById('details').textContent=`Generated ${data.generated_at}. ${data.valid_symbols} valid symbols of ${data.requested_symbols} requested.`;for(const r of data.records){if(typeof r.symbol!=='string'||!Number.isFinite(r.close)||!Number.isFinite(r.momentum_score))throw Error('Invalid record.');const tr=document.createElement('tr');for(const value of [r.symbol,r.as_of,r.close.toFixed(2),r.momentum_score.toFixed(1),r.signal]){const td=document.createElement('td');td.textContent=String(value);tr.appendChild(td);}document.getElementById('rows').appendChild(tr);}if(data.records.length===0)status.textContent+=' No candidates met the configured threshold.';}catch(error){document.getElementById('rows').replaceChildren();status.textContent='UNAVAILABLE: '+error.message;}})();
</script></html>
