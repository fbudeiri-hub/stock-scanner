name: Scanner validation - no automatic market scans
on:
  push:
    branches: [repair/scanner-data-integrity-20261015]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/ --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-scanner-tests
          path: test-results.xml
